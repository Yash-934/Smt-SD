name: Build & Release Android App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Target'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
          - 'both'
      create_github_release:
        description: 'Create GitHub Release for tagged versions'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper with version 9.3.1..."
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Environment & Secrets
        run: |
          # Ensure .env file exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Setup Signing Keystore
          STORE_PWD="${{ secrets.STORE_PASSWORD }}"
          KEY_PWD="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$STORE_PWD" ]; then STORE_PWD="android"; fi
          if [ -z "$KEY_PWD" ]; then KEY_PWD="android"; fi

          KEYSTORE_VALID=false

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            if keytool -list -keystore my-upload-key.jks -alias upload -storepass "$STORE_PWD" > /dev/null 2>&1; then
              echo "✓ Key with alias 'upload' verified."
              KEYSTORE_VALID=true
            else
              echo "⚠️ Key alias 'upload' not found in provided secret keystore. Generating fresh release key with alias 'upload'..."
            fi
          fi

          if [ "$KEYSTORE_VALID" = false ]; then
            echo "Generating valid release upload keystore with alias 'upload'..."
            rm -f my-upload-key.jks
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PWD" -keypass "$KEY_PWD" -dname "CN=SchoolMarksPortal, OU=Release, O=AIStudio, L=Global, ST=Global, C=US"
          fi

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PWD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PWD" >> $GITHUB_ENV

      - name: Build Android App (Release & Debug)
        run: |
          if [ -f ./gradlew ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "Using build command: $GRADLE_CMD"

          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            $GRADLE_CMD assembleDebug --stacktrace
          elif [ "$BUILD_TYPE" = "both" ]; then
            $GRADLE_CMD assembleDebug assembleRelease bundleRelease --stacktrace
          else
            $GRADLE_CMD assembleRelease bundleRelease --stacktrace
          fi

      - name: Prepare Artifacts
        run: |
          mkdir -p build-artifacts
          
          # Copy APKs
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} build-artifacts/ \; 2>/dev/null || true
          
          # Copy AABs
          find app/build/outputs/bundle/ -name "*.aab" -type f -exec cp {} build-artifacts/ \; 2>/dev/null || true
          
          echo "Generated Artifacts:"
          ls -la build-artifacts/

      - name: Upload APKs & AABs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: school-marks-portal-binaries
          path: build-artifacts/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event.inputs.create_github_release == 'true' && github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: "School Marks Portal ${{ github.ref_name }}"
